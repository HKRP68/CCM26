# Dedicated Telegram bot: one poller, a separate token and the existing database.
# First redeploy the original bot from main; it no longer runs auction handlers.
# HTTP serves a fast status page, /livez and /healthz. The browser auction
# workspace is deployed separately with render.franchise.yaml.
services:
  - type: web
    name: franchise-auction-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python franchise_bot.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRANCHISE_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRANCHISE_OWNER_IDS
        sync: false
      - key: FRANCHISE_ADMIN_IDS
        value: ""
      - key: FRANCHISE_SOLO_LEAGUE
        value: "false"
