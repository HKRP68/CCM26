<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lucky Spin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- The ad SDK is loaded at runtime from /api/ads/config: this page is a
       static file, so it can't be told at render time which network is active.
       See services/ad_service.py. -->
  <script>
    window.__adConfig = null;
    window.__adSdkReady = (async function () {
      try {
        const res = await fetch('/api/ads/config');
        const cfg = (await res.json())?.ads;
        if (!cfg || !cfg.configured || !cfg.sdk_url) return false;
        window.__adConfig = cfg;
        await new Promise((resolve, reject) => {
          const el = document.createElement('script');
          el.src = cfg.sdk_url;
          if (cfg.provider === 'monetag') {
            el.setAttribute('data-zone', cfg.zone_id);
            el.setAttribute('data-sdk', cfg.sdk_function);
          }
          el.onload = resolve;
          el.onerror = reject;
          document.head.appendChild(el);
          setTimeout(resolve, 6000);   // never block the wheel on a dead CDN
        });
        return true;
      } catch (e) { return false; }
    })();
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #4facfe;
      --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --bg-gradient: linear-gradient(135deg, #090718 0%, #1a1040 50%, #0e0b26 100%);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #f0f4ff;
      --hint: #9099b8;
      --success: #34c759;
      --danger: #ff3b30;
      --gold: #e8b84b;
      --gold-2: #fcc844;
      --gold-glow: rgba(232, 184, 75, 0.3);
      --heading-font: 'Plus Jakarta Sans', 'Outfit', sans-serif;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      margin: 0; padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .content { max-width: 480px; margin: 0 auto; padding: 24px; padding-bottom: 60px; }

    .header {
      display: flex; align-items: center; margin-bottom: 24px;
      background: rgba(0,0,0,0.35); padding: 16px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .avatar {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-right: 16px;
      box-shadow: 0 0 24px var(--gold-glow), 0 4px 12px rgba(0,0,0,0.4);
      flex-shrink: 0; color: #000; font-weight: 700;
    }
    .user-name {
      font-family: var(--heading-font);
      font-size: 20px; font-weight: 800; margin: 0;
    }
    .balance-row { display: flex; gap: 14px; margin-top: 4px; font-size: 14px; color: var(--hint); font-weight: 600; }

    /* ── Premium Spin Wheel ── */
    .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 30px auto; }
    .wheel {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(from -90deg,
        #1a1240 0deg 35.5deg, #0a0820 35.5deg 36deg,
        #4facfe 36deg 71.5deg, #0a0820 71.5deg 72deg,
        #1a1240 72deg 107.5deg, #0a0820 107.5deg 108deg,
        #9c27b0 108deg 143.5deg, #0a0820 143.5deg 144deg,
        #1a1240 144deg 179.5deg, #0a0820 179.5deg 180deg,
        #ff3b30 180deg 215.5deg, #0a0820 215.5deg 216deg,
        #1a1240 216deg 251.5deg, #0a0820 251.5deg 252deg,
        #34c759 252deg 287.5deg, #0a0820 287.5deg 288deg,
        #1a1240 288deg 323.5deg, #0a0820 323.5deg 324deg,
        #e8b84b 324deg 359.5deg, #0a0820 359.5deg 360deg
      );
      box-shadow:
        0 0 0 3px #1e1650,
        0 0 0 5px var(--gold),
        0 0 0 7px #1e1650,
        0 0 50px rgba(0,0,0,0.9),
        0 0 60px rgba(79,172,254,0.12),
        inset 0 0 20px rgba(0,0,0,0.7);
      transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
    }
    @keyframes spinLoop { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #spin-wheel.wheel-free-spin { animation: spinLoop 0.7s linear infinite; }
    .wheel-pointer {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
      border-top: 40px solid var(--gold); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 6px var(--gold-glow));
      z-index: 10; transform-origin: 50% 0%;
    }
    .wheel-pointer.tick { animation: pointer-click 0.15s ease-out; }
    .wheel-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 60px; height: 60px;
      background: radial-gradient(circle, var(--gold-2), var(--gold), #8a5a00);
      border-radius: 50%; border: 3px solid var(--gold-2);
      box-shadow: 0 0 20px var(--gold-glow), 0 0 40px rgba(232,184,75,0.2), 0 0 8px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 5;
    }
    .wheel-lights { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 3; }
    .light {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin-top: -4px; margin-left: -4px;
      border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff, 0 0 12px var(--gold);
      animation: light-flash 0.6s infinite alternate;
    }
    .light:nth-child(even) { animation-delay: 0.3s; background: var(--gold); }
    @keyframes light-flash {
      0% { opacity: 0.4; filter: brightness(0.8); }
      100% { opacity: 1; filter: brightness(1.3); box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold); }
    }
    @keyframes pointer-click {
      0% { transform: translateX(-50%) rotate(0deg); }
      50% { transform: translateX(-50%) rotate(-15deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }
    .slice-text {
      position: absolute; top: 50%; left: 50%; width: 50%; height: 24px; margin-top: -12px;
      transform-origin: 0 50%; display: flex; align-items: center; justify-content: flex-end;
      padding-right: 25px; box-sizing: border-box; font-size: 18px; font-weight: 800;
      font-family: var(--heading-font);
      color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); user-select: none;
    }
    /* 10 slices, 36 degrees each. Center is i * 36 + 18 */
    .slice-text[data-i="0"] { transform: rotate(18deg); }
    .slice-text[data-i="1"] { transform: rotate(54deg); }
    .slice-text[data-i="2"] { transform: rotate(90deg); }
    .slice-text[data-i="3"] { transform: rotate(126deg); }
    .slice-text[data-i="4"] { transform: rotate(162deg); }
    .slice-text[data-i="5"] { transform: rotate(198deg); }
    .slice-text[data-i="6"] { transform: rotate(234deg); }
    .slice-text[data-i="7"] { transform: rotate(270deg); }
    .slice-text[data-i="8"] { transform: rotate(306deg); }
    .slice-text[data-i="9"] { transform: rotate(342deg); padding-right: 16px; font-size: 22px; }

    .grand-prize-tag {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 20px auto 25px auto; padding: 12px 20px; max-width: 300px; border-radius: 30px;
      background: linear-gradient(135deg, rgba(232,184,75,0.1) 0%, rgba(232,184,75,0.04) 100%);
      border: 1px solid rgba(232,184,75,0.35);
      box-shadow: 0 0 20px rgba(232,184,75,0.12), inset 0 0 12px rgba(232,184,75,0.06);
      font-size: 14px; color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      position: relative; overflow: hidden;
    }
    .grand-prize-tag::before {
      content: '';
      position: absolute; top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: skewX(-20deg);
      animation: prizeShimmer 3s ease-in-out 1s infinite;
    }
    @keyframes prizeShimmer { 0% { left: -80%; } 60% { left: 140%; } 100% { left: 140%; } }
    .prize-crown { font-size: 20px; animation: crown-float 2s ease-in-out infinite alternate; }
    .prize-tag-text { font-family: var(--heading-font); font-weight: 700; }
    @keyframes crown-float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-3px) scale(1.1); } }

    @keyframes btnShimmer { 0% { left: -60%; } 100% { left: 130%; } }
    .btn {
      background: var(--primary-gradient); color: white; border: none; padding: 16px 24px;
      border-radius: 16px;
      font-family: var(--heading-font);
      font-weight: 800; font-size: 17px; letter-spacing: 0.02em;
      width: 100%; cursor: pointer;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35), 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 8px;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      animation: btnShimmer 3s ease-in-out infinite;
      pointer-events: none;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 3px 10px rgba(79, 172, 254, 0.2); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; background: #333; box-shadow: none; }
    .btn:disabled::after { display: none; }
    .btn.ghost {
      background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
      box-shadow: none; font-family: 'Outfit', sans-serif; font-weight: 700;
    }
    .btn.ghost::after { display: none; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }

    .title-block { text-align: center; margin-bottom: 18px; margin-top: 4px; }
    .title-block h1 {
      margin: 0 0 8px 0; font-size: 30px;
      font-family: var(--heading-font); font-weight: 800;
      background: linear-gradient(90deg, var(--gold), var(--gold-2), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 100%;
      animation: goldTextShimmer 3s ease-in-out infinite;
    }
    @keyframes goldTextShimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .title-block p { color: var(--hint); margin: 0; font-size: 15px; }
    .spin-status { text-align: center; font-size: 14px; margin-top: 18px; color: var(--hint); font-weight: 600; min-height: 22px; }
  </style>
</head>
<body>
  <div class="content">
    <div class="header">
      <div class="avatar" id="avatar">🏏</div>
      <div>
        <h1 class="user-name" id="user-name">Player</h1>
        <div class="balance-row">
          <span>💰 <b id="bal-coins">—</b></span>
          <span>💎 <b id="bal-gems">—</b></span>
        </div>
      </div>
    </div>

    <div class="title-block">
      <h1>Lucky Spin</h1>
      <p>Spin the wheel to win the Grand Prize!</p>
    </div>

    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <div class="wheel-lights">
        <div class="light" style="transform: rotate(0deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(36deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(72deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(108deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(144deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(180deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(216deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(252deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(288deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(324deg) translate(146px);"></div>
      </div>
      <div class="wheel" id="spin-wheel">
        <div class="slice-text" data-i="0">100</div>
        <div class="slice-text" data-i="1">500</div>
        <div class="slice-text" data-i="2">💎</div>
        <div class="slice-text" data-i="3">1k</div>
        <div class="slice-text" data-i="4">100</div>
        <div class="slice-text" data-i="5">2k</div>
        <div class="slice-text" data-i="6">💎</div>
        <div class="slice-text" data-i="7">500</div>
        <div class="slice-text" data-i="8">100</div>
        <div class="slice-text" data-i="9">🏆</div>
      </div>
      <div class="wheel-center">⭐</div>
    </div>

    <div class="grand-prize-tag">
      <span class="prize-crown">👑</span>
      <span class="prize-tag-text">Grand Prize: <b>Rare Player Card</b></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
      <button class="btn pulse" id="free-spin-btn" onclick="executeSpin(false)"><span>🎁 Spin for Free</span></button>
      <button class="btn ghost" id="ad-spin-btn" onclick="executeSpin(true)"><span>📺 Watch Ad to Spin</span></button>
    </div>

    <div class="spin-status" id="spin-status"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const initData = (tg && tg.initData) ? tg.initData : '';
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'tma ' + initData };
    }

    // Greet the user from initData (cosmetic; balances fill in after a spin).
    (function greet() {
      try {
        const u = tg?.initDataUnsafe?.user;
        if (u) {
          document.getElementById('user-name').innerText = u.first_name || u.username || 'Player';
          if (u.first_name) document.getElementById('avatar').innerText = u.first_name[0].toUpperCase();
        }
      } catch (e) {}
    })();

    function setBalance(bal) {
      if (!bal) return;
      if (bal.coins != null) document.getElementById('bal-coins').innerText = Number(bal.coins).toLocaleString();
      if (bal.gems != null) document.getElementById('bal-gems').innerText = Number(bal.gems).toLocaleString();
    }

    let currentRotation = 0;

    // Read the wheel's current visual rotation (0..360) from its computed transform.
    function currentWheelAngle() {
      const wheel = document.getElementById('spin-wheel');
      const style = window.getComputedStyle(wheel);
      const matrix = style.transform || style.webkitTransform;
      if (!matrix || matrix === 'none') return 0;
      try {
        const v = matrix.split('(')[1].split(')')[0].split(',');
        let angle = Math.round(Math.atan2(parseFloat(v[1]), parseFloat(v[0])) * (180 / Math.PI));
        if (angle < 0) angle += 360;
        return angle;
      } catch (e) { return 0; }
    }

    // Start an immediate, continuous free spin so the wheel reacts the instant
    // the user taps — instead of sitting frozen while the network request runs.
    function startContinuousSpin() {
      const wheel = document.getElementById('spin-wheel');
      wheel.style.transition = 'none';
      wheel.classList.add('wheel-free-spin');
    }

    // Stop the continuous spin, pinning the wheel at its current visual angle so
    // there is no jump before the deterministic landing (or on error/cancel).
    function stopContinuousSpin() {
      const wheel = document.getElementById('spin-wheel');
      const angle = currentWheelAngle();
      wheel.classList.remove('wheel-free-spin');
      wheel.style.transition = 'none';
      wheel.style.transform = `rotate(${angle}deg)`;
      void wheel.offsetWidth; // flush reflow so the next transition animates
      currentRotation = angle;
    }

    function pickSlice(reward) {
      // Land on a slice that matches the reward type; otherwise a coin slice.
      if (reward && reward.type === 'player') return 9;       // jackpot slice
      if (reward && reward.type === 'gems') return [2, 6][Math.floor(Math.random() * 2)];
      const coinSlices = [0, 1, 3, 4, 5, 7, 8];
      return coinSlices[Math.floor(Math.random() * coinSlices.length)];
    }

    function animateTo(targetIndex) {
      try { tg?.HapticFeedback?.impactOccurred('rigid'); } catch (e) {}
      const offset = Math.floor(Math.random() * 24) - 12;     // -12..+12 deg
      const sliceCenter = targetIndex * 36 + 18;
      const targetDegree = 270 - (sliceCenter + offset);
      const extraSpins = 6;
      let nextRotation = currentRotation + (360 * extraSpins);
      nextRotation -= nextRotation % 360;
      currentRotation = nextRotation + targetDegree;

      const wheel = document.getElementById('spin-wheel');
      const pointer = document.querySelector('.wheel-pointer');
      // Restore the deceleration transition (it is cleared during the continuous spin).
      wheel.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      // Pointer "tick" + haptic as each slice passes under the pointer.
      let lastSlice = -1;
      const startTime = Date.now();
      const duration = 5000;
      function checkTick() {
        if (Date.now() - startTime >= duration) { pointer?.classList.remove('tick'); return; }
        const style = window.getComputedStyle(wheel);
        const matrix = style.transform || style.webkitTransform;
        if (matrix && matrix !== 'none') {
          const v = matrix.split('(')[1].split(')')[0].split(',');
          let angle = Math.round(Math.atan2(parseFloat(v[1]), parseFloat(v[0])) * (180 / Math.PI));
          if (angle < 0) angle += 360;
          const cur = Math.floor(angle / 36);
          if (cur !== lastSlice) {
            lastSlice = cur;
            if (pointer) { pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick'); }
            try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {}
          }
        }
        requestAnimationFrame(checkTick);
      }
      requestAnimationFrame(checkTick);
    }

    function launchSpinConfetti(type) {
      const palettes = {
        player: ['#e8b84b', '#fcc844', '#fff', '#ff8c00', '#ffd700'],
        gems:   ['#a78bfa', '#c4b5fd', '#7c3aed', '#fff', '#e0d9ff'],
        coins:  ['#4facfe', '#00f2fe', '#fff', '#c0c0c0', '#b8d8ff']
      };
      const palette = palettes[type] || palettes.coins;
      const layer = document.createElement('div');
      layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
      document.body.appendChild(layer);
      const count = type === 'player' ? 80 : 40;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const size = 6 + Math.random() * 8;
        p.style.cssText = [
          'position:absolute',
          `top:-${size}px`,
          `left:${Math.random()*100}%`,
          `width:${size}px`,
          `height:${size*1.4}px`,
          `background:${palette[i%palette.length]}`,
          `border-radius:${Math.random()>0.5?'50%':'2px'}`,
          'opacity:0.9',
          `animation:confettiFall ${2+Math.random()*2}s linear ${Math.random()*0.8}s forwards`
        ].join(';');
        layer.appendChild(p);
      }
      if (!document.getElementById('spin-confetti-kf')) {
        const s = document.createElement('style');
        s.id = 'spin-confetti-kf';
        s.textContent = '@keyframes confettiFall{0%{transform:translateY(0) rotateZ(0);opacity:1}100%{transform:translateY(110vh) rotateZ(720deg);opacity:0}}';
        document.head.appendChild(s);
      }
      setTimeout(() => layer.remove(), 4500);
    }

    function rewardText(r) {
      if (!r) return 'You won a prize!';
      if (r.type === 'player') {
        return `<span style="color:#FFD700;font-size:18px;font-weight:bold;text-shadow:0 0 15px #ffd700;">🎉 JACKPOT! Won ${r.player_name || 'a player'}${r.player_rating ? ` (${r.player_rating} OVR)` : ''}! 🎉</span>`;
      }
      if (r.type === 'gems') return `<span style="color:#a78bfa;">You won ${Number(r.amount).toLocaleString()} gems! 💎</span>`;
      return `<span style="color:#00f2fe;">You won ${Number(r.amount).toLocaleString()} coins!</span>`;
    }

    async function doSpin(adToken) {
      // Hard timeout so a slow/hanging request can never leave the wheel
      // spinning forever — it aborts and surfaces an error instead.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const res = await fetch('/api/webapp/spin', {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify(adToken ? { ad_token: adToken } : {}),
          signal: controller.signal
        });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, status: res.status, data };
      } finally {
        clearTimeout(timer);
      }
    }

    async function getAdToken() {
      // Best-effort: show an ad if the SDK is available, then claim a token.
      // The SDK promise is not guaranteed to settle — a request that dies on a
      // phone network can hang indefinitely — so it is raced against a timer
      // rather than awaited outright, which is what used to strand this page on
      // "LOADING AD…" with nothing ever happening.
      try {
        const show = await adShowFn();
        if (show) {
          await Promise.race([
            show(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('ad timeout')), 12000)),
          ]);
        }
      } catch (e) { /* ad skipped/failed/timed out — still try to claim */ }
      // Bound the claim request so a stalled ad-completion can't hang the spin.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const res = await fetch('/api/webapp/ad-completed', {
          method: 'POST', headers: authHeaders(), signal: controller.signal });
        const data = await res.json().catch(() => ({}));
        return data && data.ad_token ? data.ad_token : '';
      } finally {
        clearTimeout(timer);
      }
    }

    async function executeSpin(isAd) {
      const freeBtn = document.getElementById('free-spin-btn');
      const adBtn = document.getElementById('ad-spin-btn');
      const status = document.getElementById('spin-status');
      if (freeBtn.disabled && adBtn.disabled) return;

      freeBtn.disabled = true; adBtn.disabled = true;
      status.innerHTML = isAd ? 'LOADING AD… ⏳' : 'SPINNING… 🎡';

      try {
        // Spin the wheel right away — before the ad-token flow too — so it reacts
        // instantly and never sits frozen while any network request runs.
        startContinuousSpin();

        let adToken = '';
        if (isAd) { adToken = await getAdToken(); status.innerHTML = 'SPINNING… 🎡'; }

        const { ok, status: code, data } = await doSpin(adToken);

        if (!ok || !data.ok) {
          stopContinuousSpin();
          const msg = (data && (data.message || data.error)) || 'Spin failed.';
          status.innerHTML = `<span style="color:var(--danger);">${msg}</span>`;
          // ad_required → free already used; keep ad button. cycle_exhausted → both off.
          if (data && data.error === 'cycle_exhausted') { freeBtn.disabled = true; adBtn.disabled = true; }
          else if (data && data.error === 'ad_required') { freeBtn.disabled = true; adBtn.disabled = false; }
          else { freeBtn.disabled = false; adBtn.disabled = false; }
          return;
        }

        const reward = data.reward;
        stopContinuousSpin();
        animateTo(pickSlice(reward));

        setTimeout(() => {
          status.innerHTML = rewardText(reward);
          if (reward) launchSpinConfetti(reward.type);
          setBalance(data.balance);
          try {
            if (reward && reward.type === 'player') tg?.HapticFeedback?.notificationOccurred('success');
            else tg?.HapticFeedback?.impactOccurred('heavy');
          } catch (e) {}
          // The free slot is consumed after a free spin; ad spins remain.
          if (data.slot_type === 'free') {
            freeBtn.innerHTML = '<span>⏳ Free spin used</span>';
            freeBtn.classList.remove('pulse'); freeBtn.disabled = true;
          } else {
            freeBtn.disabled = false;
          }
          adBtn.disabled = false;
        }, 5000);
      } catch (err) {
        stopContinuousSpin();
        const timedOut = err && err.name === 'AbortError';
        status.innerHTML = `<span style="color:var(--danger);">${timedOut ? 'Spin timed out. Please try again.' : 'Something went wrong. Try again.'}</span>`;
        freeBtn.disabled = false; adBtn.disabled = false;
      }
    }

    // Returns a zero-arg function that shows one ad and resolves when it was
    // watched, or null when no network is usable. Provider differences live
    // here and nowhere else on this page.
    async function adShowFn() {
      try {
        await window.__adSdkReady;
        const cfg = window.__adConfig;
        if (!cfg || !cfg.configured) return null;
        if (cfg.provider === 'monetag') {
          const fn = window[cfg.sdk_function];
          if (typeof fn !== 'function') return null;
          const ymid = tg?.initDataUnsafe?.user?.id;
          // ymid is what Monetag echoes back in its server-to-server postback.
          return () => fn(ymid ? { ymid: String(ymid), requestVar: 'spin' } : {});
        }
        if (!window.Adsgram?.init) return null;
        if (!window.__adController) {
          window.__adController = window.Adsgram.init({ blockId: cfg.placement_id });
        }
        return () => window.__adController.show();
      } catch (e) { return null; }
    }
  </script>
