<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lucky Card Pick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js" async></script>
  <!-- The block id can't be baked in: this page is a static file with no
       template pass, so it is read from /api/ads/config. The SDK script above
       is unconditional on purpose — gating it on configuration means one wrong
       env var removes ads entirely with nothing to show for it. -->
  <script>
    window.__adConfig = null;
    window.__adSdkReady = (async function () {
      try {
        const res = await fetch('/api/ads/config');
        const cfg = (await res.json())?.ads;
        if (!cfg || !cfg.configured || !cfg.block_id) return false;
        window.__adConfig = cfg;
        // Loaded is not quite ready — give window.Adsgram a moment to appear
        // rather than judging at this instant and writing the SDK off.
        const deadline = Date.now() + 5000;
        while (!window.Adsgram?.init && Date.now() < deadline) {
          await new Promise(r => setTimeout(r, 150));
        }
        if (!window.Adsgram?.init) {
          console.warn('[ads] Adsgram SDK never became available');
          return false;
        }
        return true;
      } catch (e) {
        // Degrading to no-fill silently is what makes a dead ad network look
        // like a broken app in production. Say why in the console.
        console.warn('[ads] SDK failed to load', e);
        return false;
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #4facfe;
      --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --bg-gradient: linear-gradient(135deg, #090718 0%, #1a1040 50%, #0e0b26 100%);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #f0f4ff;
      --hint: #9099b8;
      --success: #34c759;
      --danger: #ff3b30;
      --gold: #e8b84b;
      --gold-2: #fcc844;
      --gold-glow: rgba(232, 184, 75, 0.3);
      --heading-font: 'Plus Jakarta Sans', 'Outfit', sans-serif;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      margin: 0; padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .content { max-width: 480px; margin: 0 auto; padding: 24px; padding-bottom: 60px; }

    .header {
      display: flex; align-items: center; margin-bottom: 24px;
      background: rgba(0,0,0,0.35); padding: 16px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .avatar {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-right: 16px;
      box-shadow: 0 0 24px var(--gold-glow), 0 4px 12px rgba(0,0,0,0.4);
      flex-shrink: 0; color: #000; font-weight: 700;
    }
    .user-name {
      font-family: var(--heading-font);
      font-size: 20px; font-weight: 800; margin: 0;
    }
    .balance-row { display: flex; gap: 14px; margin-top: 4px; font-size: 14px; color: var(--hint); font-weight: 600; }

    /* ── The deck ──
       Five face-down cards. The player picks one; the server has already
       decided which reward is behind it. The pick is the reveal, never the
       request — see the script below for why that ordering matters. */
    .deck {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 8px; margin: 8px auto 26px; perspective: 1100px;
    }
    .card {
      flex: 0 1 74px; height: 112px; padding: 0; border: none; background: none;
      cursor: default; position: relative;
      /* The button's own perspective: the deck's does not reach through the
         transform on this element, and without one the flip renders flat. */
      perspective: 800px;
      transform: translateY(var(--fan-y, 0)) rotate(var(--fan-r, 0deg));
      transition: transform .25s ease, filter .25s ease, opacity .25s ease;
    }
    .card[data-i="0"] { --fan-y: 12px; --fan-r: -9deg; }
    .card[data-i="1"] { --fan-y: 4px;  --fan-r: -4deg; }
    /* 0px, not 0: this value is substituted into calc(var(--fan-y) - 8px)
       below, and a unitless zero is a <number> there, not a length — the
       whole declaration is invalid and dropped, so the centre card would
       neither bob nor depress. */
    .card[data-i="2"] { --fan-y: 0px;  --fan-r: 0deg; }
    .card[data-i="3"] { --fan-y: 4px;  --fan-r: 4deg; }
    .card[data-i="4"] { --fan-y: 12px; --fan-r: 9deg; }
    .card-inner {
      /* display:block is load-bearing — these wrappers are spans (a <button>
         may not contain a <div>), and an inline box ignores width/height, so
         without it the whole card collapses to the size of its crest. */
      display: block; position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4,.9,.3,1.2);
    }
    .face {
      position: absolute; inset: 0; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      overflow: hidden; text-align: center; padding: 4px;
    }
    .face-back {
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 3px, transparent 3px 8px),
        linear-gradient(160deg, #241a52, #150f33 55%, #0b0820);
      border: 2px solid rgba(232,184,75,.5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.6);
    }
    .face-back::after {
      content: ''; position: absolute; inset: 6px; border-radius: 7px;
      border: 1px solid rgba(232,184,75,.25);
    }
    .crest { font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
    .face-front {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, #2a2258, #161033);
      border: 2px solid rgba(255,255,255,.16);
      box-shadow: 0 6px 18px rgba(0,0,0,.6);
    }
    .face-front .prize { font-size: 24px; line-height: 1; }
    .face-front .prize-label {
      font-size: 10px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase;
      color: var(--hint); margin-top: 5px; line-height: 1.15;
      max-width: 100%; padding: 0 3px; word-break: break-word;
    }

    .deck.armed .card { cursor: pointer; animation: float 1.6s ease-in-out infinite; }
    .deck.armed .card[data-i="1"] { animation-delay: .12s; }
    .deck.armed .card[data-i="2"] { animation-delay: .24s; }
    .deck.armed .card[data-i="3"] { animation-delay: .36s; }
    .deck.armed .card[data-i="4"] { animation-delay: .48s; }
    .deck.armed .face-back { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.14); }
    .deck.armed .card:active { transform: translateY(calc(var(--fan-y, 0px) - 7px)) rotate(var(--fan-r, 0deg)) scale(.95); }
    @keyframes float {
      0%, 100% { transform: translateY(var(--fan-y, 0)) rotate(var(--fan-r, 0deg)); }
      50% { transform: translateY(calc(var(--fan-y, 0px) - 8px)) rotate(var(--fan-r, 0deg)); }
    }

    .card.dealing { animation: deal .4s cubic-bezier(.3,1.3,.5,1) both; }
    @keyframes deal {
      from { opacity: 0; transform: translate(-46px, 30px) rotate(-26deg) scale(.78); }
      to   { opacity: 1; transform: translateY(var(--fan-y, 0)) rotate(var(--fan-r, 0deg)); }
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card.miss { opacity: .4; filter: saturate(.3); }
    .card.won { z-index: 2; }
    .card.won .card-inner { transform: rotateY(180deg) scale(1.16); }
    .card.won .face-front {
      border-color: var(--gold);
      background: linear-gradient(160deg, rgba(232,184,75,.32), rgba(22,16,51,.96));
      box-shadow: 0 0 30px rgba(232,184,75,.8);
    }
    .card.won .face-front .prize-label { color: #fff; }
    .card.won.tier-player .face-front { border-color: #ffd966; box-shadow: 0 0 42px rgba(255,217,102,1); }
    .card.won.tier-gems .face-front { border-color: #a78bfa; box-shadow: 0 0 32px rgba(167,139,250,.9); }

    @keyframes btnShimmer { 0% { left: -60%; } 100% { left: 130%; } }
    .btn {
      background: var(--primary-gradient); color: white; border: none; padding: 16px 24px;
      border-radius: 16px;
      font-family: var(--heading-font);
      font-weight: 800; font-size: 17px; letter-spacing: 0.02em;
      width: 100%; cursor: pointer;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35), 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 8px;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      animation: btnShimmer 3s ease-in-out infinite;
      pointer-events: none;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 3px 10px rgba(79, 172, 254, 0.2); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; background: #333; box-shadow: none; }
    .btn:disabled::after { display: none; }
    .btn.ghost {
      background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
      box-shadow: none; font-family: 'Outfit', sans-serif; font-weight: 700;
    }
    .btn.ghost::after { display: none; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }

    .title-block { text-align: center; margin-bottom: 18px; margin-top: 4px; }
    .title-block h1 {
      margin: 0 0 8px 0; font-size: 30px;
      font-family: var(--heading-font); font-weight: 800;
      background: linear-gradient(90deg, var(--gold), var(--gold-2), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 100%;
      animation: goldTextShimmer 3s ease-in-out infinite;
    }
    @keyframes goldTextShimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .title-block p { color: var(--hint); margin: 0; font-size: 15px; min-height: 20px; }
    .title-block p.live { color: var(--gold); font-weight: 700; }

    .prize-tag {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 0 auto 22px auto; padding: 12px 20px; max-width: 320px; border-radius: 30px;
      background: linear-gradient(135deg, rgba(232,184,75,0.1) 0%, rgba(232,184,75,0.04) 100%);
      border: 1px solid rgba(232,184,75,0.35);
      box-shadow: 0 0 20px rgba(232,184,75,0.12), inset 0 0 12px rgba(232,184,75,0.06);
      font-size: 14px; color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      position: relative; overflow: hidden;
    }
    .prize-tag::before {
      content: '';
      position: absolute; top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: skewX(-20deg);
      animation: prizeShimmer 3s ease-in-out 1s infinite;
    }
    @keyframes prizeShimmer { 0% { left: -80%; } 60% { left: 140%; } 100% { left: 140%; } }
    .prize-crown { font-size: 20px; animation: crown-float 2s ease-in-out infinite alternate; }
    .prize-tag-text { font-family: var(--heading-font); font-weight: 700; }
    @keyframes crown-float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-3px) scale(1.1); } }

    .status { text-align: center; font-size: 14px; margin-top: 18px; color: var(--hint); font-weight: 600; min-height: 22px; }

    @media (max-width: 360px) {
      .deck { gap: 5px; }
      /* 0px for the same calc() reason — unitless here would stop the whole
         deck bobbing on small phones, which is the cue that it is tappable. */
      .card { flex-basis: 62px; height: 96px; --fan-y: 0px !important; --fan-r: 0deg !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .deck.armed .card, .card.dealing, .pulse, .prize-tag::before,
      .title-block h1, .btn::after { animation: none !important; }
      .card, .card-inner { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="header">
      <div class="avatar" id="avatar">🏏</div>
      <div>
        <h1 class="user-name" id="user-name">Player</h1>
        <div class="balance-row">
          <span>💰 <b id="bal-coins">—</b></span>
          <span>💎 <b id="bal-gems">—</b></span>
        </div>
      </div>
    </div>

    <div class="title-block">
      <h1>Lucky Card Pick</h1>
      <p id="hint" aria-live="polite">Five cards. One is yours.</p>
    </div>

    <div class="deck" id="deck" role="group" aria-label="Five face-down cards">
      <button class="card" type="button" data-i="0" onclick="onCardPick(0)" aria-label="Card 1">
        <span class="card-inner">
          <span class="face face-back"><span class="crest">🏏</span></span>
          <span class="face face-front"><span class="prize">🎁</span><span class="prize-label"></span></span>
        </span>
      </button>
      <button class="card" type="button" data-i="1" onclick="onCardPick(1)" aria-label="Card 2">
        <span class="card-inner">
          <span class="face face-back"><span class="crest">🏏</span></span>
          <span class="face face-front"><span class="prize">🎁</span><span class="prize-label"></span></span>
        </span>
      </button>
      <button class="card" type="button" data-i="2" onclick="onCardPick(2)" aria-label="Card 3">
        <span class="card-inner">
          <span class="face face-back"><span class="crest">🏏</span></span>
          <span class="face face-front"><span class="prize">🎁</span><span class="prize-label"></span></span>
        </span>
      </button>
      <button class="card" type="button" data-i="3" onclick="onCardPick(3)" aria-label="Card 4">
        <span class="card-inner">
          <span class="face face-back"><span class="crest">🏏</span></span>
          <span class="face face-front"><span class="prize">🎁</span><span class="prize-label"></span></span>
        </span>
      </button>
      <button class="card" type="button" data-i="4" onclick="onCardPick(4)" aria-label="Card 5">
        <span class="card-inner">
          <span class="face face-back"><span class="crest">🏏</span></span>
          <span class="face face-front"><span class="prize">🎁</span><span class="prize-label"></span></span>
        </span>
      </button>
    </div>

    <div class="prize-tag">
      <span class="prize-crown">👑</span>
      <span class="prize-tag-text">Top card: <b>Rare Player Card</b></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
      <button class="btn pulse" id="free-btn" onclick="executePick(false)"><span>🎁 Free Pick</span></button>
      <button class="btn ghost" id="ad-btn" onclick="executePick(true)"><span>📺 Watch Ad to Play</span></button>
    </div>

    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const initData = (tg && tg.initData) ? tg.initData : '';
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'tma ' + initData };
    }
    function haptic(kind) {
      try { tg?.HapticFeedback?.impactOccurred(kind || 'light'); } catch (e) {}
    }

    // Greet the user from initData (cosmetic; balances fill in after a round).
    (function greet() {
      try {
        const u = tg?.initDataUnsafe?.user;
        if (u) {
          document.getElementById('user-name').innerText = u.first_name || u.username || 'Player';
          if (u.first_name) document.getElementById('avatar').innerText = u.first_name[0].toUpperCase();
        }
      } catch (e) {}
    })();

    function setBalance(bal) {
      if (!bal) return;
      if (bal.coins != null) document.getElementById('bal-coins').innerText = Number(bal.coins).toLocaleString();
      if (bal.gems != null) document.getElementById('bal-gems').innerText = Number(bal.gems).toLocaleString();
    }

    const freeBtn = () => document.getElementById('free-btn');
    const adBtn = () => document.getElementById('ad-btn');
    const statusEl = () => document.getElementById('status');

    function setHint(text, live) {
      const el = document.getElementById('hint');
      el.textContent = text;
      el.classList.toggle('live', !!live);
    }
    // Status markup is built here, so innerHTML is fine — but everything
    // interpolated INTO it has to be escaped first. Player names come from an
    // admin-editable field, and server messages carry error text; neither is
    // ours to trust with markup. See esc() at each interpolation site.
    function setStatus(html) { statusEl().innerHTML = html; }
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // The quota as the server last reported it. Null until the first load —
    // and that gap mattered: this page used to offer "Watch Ad to Play" with
    // no idea whether a slot existed, so a fresh open could mean watching an
    // ad the server would then refuse.
    let spinQuota = null;

    async function loadQuota() {
      try {
        const res = await fetch('/api/webapp/init', {
          method: 'POST', headers: authHeaders(), body: '{}' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) return;
        setBalance({ coins: data.user?.total_coins, gems: data.user?.total_gems });
        spinQuota = data.gspin?.quota || null;
        applyQuota(spinQuota);
      } catch (e) {
        // Leave the buttons as they are: a failed status read must not be the
        // thing that stops someone playing.
        console.warn('[pick] could not read quota', e);
      }
    }

    // Paint both buttons from a quota snapshot.
    function applyQuota(quota) {
      if (!quota) return;
      // Every repaint supersedes the countdown from an earlier snapshot. Both
      // paths below can return without arming a new one — the saved-ad label
      // and the gap-is-over label — and a surviving interval would tick later
      // and overwrite whichever of them we just set, possibly re-enabling a
      // button this quota does not allow.
      clearInterval(window.__adGapTimer);
      window.__adGapTimer = null;
      if (quota.free_available) {
        freeBtn().disabled = false;
        freeBtn().classList.add('pulse');
        freeBtn().innerHTML = '<span>🎁 Free Pick</span>';
      } else {
        freeBtn().innerHTML = '<span>⏳ Free pick used</span>';
        freeBtn().classList.remove('pulse');
        freeBtn().disabled = true;
      }
      // A saved ad — one watched but never spent — is redeemed server-side
      // from the ledger, so it opens a round with no new ad at all.
      if ((quota.ads_saved || 0) > 0) {
        adBtn().disabled = false;
        adBtn().innerHTML = `<span>🎟️ Play with saved ad (${quota.ads_saved})</span>`;
        return;
      }
      applyAdGap(quota, adBtn());
    }

    // Wait time for the gap between rewarded ads: "45m", "1h 5m".
    function formatGap(seconds) {
      const mins = Math.max(1, Math.ceil(Math.max(0, seconds || 0) / 60));
      if (mins < 60) return `${mins}m`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    }

    // Reflect the server's quota on the ad button: locked with a countdown
    // while the gap runs, and re-enabled by the timer when it is up, so the
    // page recovers without a reload. The gap ships disabled, so on a default
    // deployment this only ever takes the `release()` branch.
    function applyAdGap(quota, btn) {
      const wait = quota?.ad_ready_in || 0;
      // The gap elapsing is not the same as there being a slot to spend. With
      // the cycle's last ad slot gone, re-enabling on the timer alone invites
      // an ad the server will answer `cycle_exhausted` to — banked, so nothing
      // is lost, but a wasted ad view all the same.
      const slotsLeft = (quota?.ad_used ?? 0) < (quota?.ad_total ?? 0);
      const release = () => {
        btn.disabled = !slotsLeft;
        btn.innerHTML = slotsLeft
          ? '<span>📺 Watch Ad to Play</span>'
          : '<span>✅ All picks used</span>';
      };
      if (wait <= 0) { release(); return; }
      btn.disabled = true;
      const paint = (secs) => {
        btn.innerHTML = `<span>⏱️ Next ad pick in ${formatGap(secs)}</span>`;
      };
      paint(wait);
      let left = wait;
      window.__adGapTimer = setInterval(() => {
        left -= 30;
        if (left <= 0) {
          clearInterval(window.__adGapTimer);
          release();
          return;
        }
        paint(left);
      }, 30000);
    }

    // ── The deck ────────────────────────────────────────────────────
    const CARD_COUNT = 5;
    // Never leave a granted reward unseen: a player who watches an ad and then
    // puts the phone down still gets the reveal.
    const AUTO_REVEAL_MS = 9000;
    const DECOYS = [
      // Kept to one short word each: these sit on a 74px card face, and a
      // two-word label wraps into the border.
      { emoji: '💰', label: 'Coins' },
      { emoji: '💎', label: 'Gems' },
      { emoji: '⭐', label: 'QP' },
      { emoji: '🎁', label: 'Pack' },
      { emoji: '🏏', label: 'Player' },
      { emoji: '🧤', label: 'Miss' },
      { emoji: '🎯', label: 'Almost' },
    ];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let pendingPick = null;      // the reward waiting on a tap
    let autoTimer = null;

    const cards = () => Array.from(document.querySelectorAll('#deck .card'));

    function resetDeck(hint) {
      clearTimeout(autoTimer);
      autoTimer = null;
      pendingPick = null;
      document.getElementById('deck').classList.remove('armed');
      cards().forEach(card => {
        card.classList.remove('flipped', 'won', 'miss', 'dealing', 'tier-player', 'tier-gems');
        card.style.animationDelay = '';
        card.disabled = true;
        card.querySelector('.prize').textContent = '🎁';
        card.querySelector('.prize-label').textContent = '';
      });
      setHint(hint || 'Five cards. One is yours.', false);
    }

    function armDeck(reward) {
      pendingPick = reward;
      document.getElementById('deck').classList.add('armed');
      cards().forEach((card, i) => {
        card.disabled = false;
        if (!reduceMotion.matches) {
          card.classList.remove('dealing');
          void card.offsetWidth;
          card.style.animationDelay = `${i * 55}ms`;
          card.classList.add('dealing');
        }
      });
      setHint('👆 Pick a card', true);
      setStatus('');
      haptic('light');
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => {
        if (pendingPick) reveal(Math.floor(Math.random() * CARD_COUNT));
      }, AUTO_REVEAL_MS);
    }

    // Shuffled decoy faces for the four losing cards, minus anything that
    // reads as the prize the player actually won — a "GEMS" card next to a
    // gems win looks like the game showed them two winners.
    function decoysFor(reward) {
      const byType = { coins: 'coins', gems: 'gems', quest_points: 'qp',
                       pack: 'pack', player: 'player' };
      const banned = new Set([
        (reward.label || '').toLowerCase(),
        byType[reward.type] || '',
      ]);
      const pool = DECOYS.filter(d => !banned.has(d.label.toLowerCase()));
      return (pool.length ? pool : DECOYS).sort(() => Math.random() - 0.5);
    }

    function onCardPick(index) {
      if (!pendingPick) return;
      haptic('medium');
      reveal(index);
    }

    function reveal(index) {
      const reward = pendingPick;
      if (!reward) return;
      pendingPick = null;                       // one reveal per round
      clearTimeout(autoTimer);
      autoTimer = null;
      document.getElementById('deck').classList.remove('armed');

      const decoys = decoysFor(reward);

      cards().forEach((card, i) => {
        card.disabled = true;
        card.style.animationDelay = '';
        card.classList.remove('dealing');
        const won = (i === index);
        if (won) {
          card.querySelector('.prize').textContent = reward.emoji || '🎁';
          card.querySelector('.prize-label').textContent = cardLabel(reward);
          card.classList.add('won');
          if (reward.type === 'player') card.classList.add('tier-player');
          else if (reward.type === 'gems') card.classList.add('tier-gems');
        } else {
          const decoy = decoys[i % decoys.length] || DECOYS[0];
          card.querySelector('.prize').textContent = decoy.emoji;
          card.querySelector('.prize-label').textContent = decoy.label;
          card.classList.add('miss');
        }
        setTimeout(() => card.classList.add('flipped'),
                   reduceMotion.matches ? 0 : (won ? 0 : 260 + i * 70));
      });

      setHint('', false);
      setTimeout(() => {
        setStatus(rewardText(reward));
        launchConfetti(reward.type);
        try {
          if (reward.type === 'player') tg?.HapticFeedback?.notificationOccurred('success');
          else tg?.HapticFeedback?.impactOccurred('heavy');
        } catch (e) {}
        // The round is over — hand the buttons back. Both are held down while
        // a hand is live (see executePick's finally), so without this the page
        // would sit on a revealed card with nothing left to press.
        applyQuota(spinQuota);
      }, reduceMotion.matches ? 0 : 520);
    }

    function cardLabel(r) {
      if (r.type === 'coins') return `+${Number(r.amount || 0).toLocaleString()}`;
      if (r.type === 'gems') return `+${r.amount} 💎`;
      if (r.type === 'quest_points') return `+${r.amount} QP`;
      if (r.type === 'player') return r.player_rating ? `${r.player_rating} OVR` : 'Player';
      if (r.type === 'pack') return 'Pack';
      return r.label || 'Reward';
    }

    function launchConfetti(type) {
      if (reduceMotion.matches) return;
      const palettes = {
        player: ['#e8b84b', '#fcc844', '#fff', '#ff8c00', '#ffd700'],
        gems:   ['#a78bfa', '#c4b5fd', '#7c3aed', '#fff', '#e0d9ff'],
        coins:  ['#4facfe', '#00f2fe', '#fff', '#c0c0c0', '#b8d8ff']
      };
      const palette = palettes[type] || palettes.coins;
      const layer = document.createElement('div');
      layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
      document.body.appendChild(layer);
      const count = type === 'player' ? 80 : 40;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const size = 6 + Math.random() * 8;
        p.style.cssText = [
          'position:absolute',
          `top:-${size}px`,
          `left:${Math.random()*100}%`,
          `width:${size}px`,
          `height:${size*1.4}px`,
          `background:${palette[i%palette.length]}`,
          `border-radius:${Math.random()>0.5?'50%':'2px'}`,
          'opacity:0.9',
          `animation:confettiFall ${2+Math.random()*2}s linear ${Math.random()*0.8}s forwards`
        ].join(';');
        layer.appendChild(p);
      }
      if (!document.getElementById('confetti-kf')) {
        const s = document.createElement('style');
        s.id = 'confetti-kf';
        s.textContent = '@keyframes confettiFall{0%{transform:translateY(0) rotateZ(0);opacity:1}100%{transform:translateY(110vh) rotateZ(720deg);opacity:0}}';
        document.head.appendChild(s);
      }
      setTimeout(() => layer.remove(), 4500);
    }

    function rewardText(r) {
      if (!r) return 'You won a prize!';
      if (r.type === 'player') {
        return `<span style="color:#FFD700;font-size:18px;font-weight:bold;text-shadow:0 0 15px #ffd700;">🎉 ${esc(r.player_name || 'A player')}${r.player_rating ? ` (${esc(r.player_rating)} OVR)` : ''}! 🎉</span>`;
      }
      if (r.type === 'gems') return `<span style="color:#a78bfa;">You won ${Number(r.amount).toLocaleString()} gems! 💎</span>`;
      if (r.type === 'quest_points') return `<span style="color:#00f2fe;">You won ${Number(r.amount).toLocaleString()} quest points! ⭐</span>`;
      if (r.type === 'pack') return `<span style="color:#00f2fe;">You won a pack! 🎁</span>`;
      return `<span style="color:#00f2fe;">You won ${Number(r.amount).toLocaleString()} coins!</span>`;
    }

    // ── The reward call ─────────────────────────────────────────────
    async function claimReward(adToken, onRetry) {
      // Hard timeout so a slow/hanging request can never leave the page waiting
      // forever — it aborts and surfaces an error instead.
      //
      // Retried up to three times on a transport failure, always with the same
      // request_id. The ad is already spent by the time this runs, so a dropped
      // connection must not cost the player their reward: if the first attempt
      // reached the server, the id makes the retry replay that same reward
      // rather than granting a second one. A server that answered — even with
      // an error — has decided, and is never retried.
      const requestId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      const body = JSON.stringify(
        adToken ? { ad_token: adToken, request_id: requestId }
                : { request_id: requestId });
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const res = await fetch('/api/webapp/spin', {
            method: 'POST', headers: authHeaders(),
            body, signal: controller.signal
          });
          const data = await res.json().catch(() => ({}));
          return { ok: res.ok, status: res.status, data };
        } catch (e) {
          lastErr = e;
          if (attempt < 2) {
            try { onRetry?.(attempt + 1); } catch (_) {}
            await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
          }
        } finally {
          clearTimeout(timer);
        }
      }
      throw lastErr;
    }

    // ── The ad ──────────────────────────────────────────────────────
    // Returns {token} when the player has genuinely earned a slot, or
    // {error} naming why they haven't.
    //
    // Only a *watched* ad mints a token. This used to call /ad-completed
    // regardless — after a skip, after a timeout, even when the SDK was never
    // usable — which meant the page handed out rewards for ads nobody saw. A
    // network that served nothing is a real problem and it has its own answer
    // below (the no-fill pass); silently paying out is not that answer.
    async function getAdToken() {
      let show = null;
      try {
        show = await adShowFn();
      } catch (e) {
        console.warn('[ads] no usable show function', e);
      }
      if (!show) {
        // No ad network configured at all (dev, or a deployment with no block
        // id) — the same mock token the Mini App sends. The server accepts a
        // MOCK- token only when ads really are unconfigured or WEBAPP_DEV_MODE
        // is on, so this cannot become a way past a live ad network.
        await window.__adSdkReady;
        if (!window.__adConfig?.configured) {
          setStatus('📺 Playing ad… (mock)');
          await new Promise(r => setTimeout(r, 1000));
          return { token: 'MOCK-' + Date.now() };
        }
        // Configured, but the SDK never became usable: blocked domain, dead
        // DNS, a block id it rejects. The player cannot watch an ad their
        // network will not load, so rescue the attempt with a pass.
        return await noFillPass('unavailable');
      }

      let done = false;
      try {
        // The SDK promise is not guaranteed to settle — a request that dies on
        // a phone network can hang indefinitely — so it is raced against a
        // timer rather than awaited outright, which is what used to strand
        // this page on "LOADING AD…" with nothing ever happening.
        const result = await Promise.race([
          show(),
          new Promise((_, reject) => setTimeout(
            () => reject({ nofill: true, message: 'ad request timed out' }), 12000)),
        ]);
        // Some SDK versions resolve without `done` when the user closed the ad
        // early. Treat a missing `done` as a skip, not as a completed view.
        done = !!(result && result.done !== false);
      } catch (e) {
        const desc = ((e && (e.description || e.message)) || '').toString();
        const state = ((e && (e.state || e.error)) || '').toString().toLowerCase();
        const nofill = !!(e && e.nofill)
          || /no.?banner|not.?loaded|unavailable|empty|no.?ad|no.?fill/i.test(desc)
          || state.includes('nofill') || state.includes('no_banner')
          || state.includes('load');
        // A skip is the player's own choice and gets no rescue — replaying an
        // ad someone just closed, or paying them for it, are both wrong.
        return nofill ? await noFillPass('nofill') : { error: 'skipped' };
      }
      if (!done) return { error: 'skipped' };

      // Bound the claim request so a stalled ad-completion can't hang the round.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const res = await fetch('/api/webapp/ad-completed', {
          method: 'POST', headers: authHeaders(), signal: controller.signal });
        const data = await res.json().catch(() => ({}));
        if (data && data.ad_token) return { token: data.ad_token };
      } catch (e) {
        console.warn('[ads] could not register the completed ad', e);
      } finally {
        clearTimeout(timer);
      }
      // The ad was watched. Even if this response was lost, the server wrote
      // it to the ledger, so the round can go ahead with no token and the
      // saved ad is redeemed there.
      return { token: '' };
    }

    // The network had nothing to serve. That is not the player's fault and
    // must not dead-end them, so ask for a no-fill pass — capped per cycle
    // server-side, so it can never become the cheap route past every ad.
    async function noFillPass(reason) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const res = await fetch('/api/webapp/ad-unavailable', {
            method: 'POST', headers: authHeaders(),
            body: JSON.stringify({ kind: 'spin' }), signal: controller.signal });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ad_token) {
            const left = data.quota?.nofill_left;
            setStatus('📺 No ads available — using a no-ad pass'
                      + (typeof left === 'number' ? ` (${left} left this cycle)` : ''));
            return { token: data.ad_token };
          }
        } finally {
          clearTimeout(timer);
        }
      } catch (e) {
        console.warn('[ads] no-fill pass request failed', e);
      }
      return { error: reason };
    }

    const AD_ERROR_TEXT = {
      skipped: 'Ad skipped — watch it to the end to earn a pick.',
      nofill: 'No ad available right now, and your no-ad passes are used up. Try again in a few minutes.',
      unavailable: 'Ads can\'t load right now — check your connection and reopen the app.',
    };

    let inFlight = false;

    async function executePick(isAd) {
      if (inFlight) return;
      // A round is already dealt and waiting on a tap — send them to the cards
      // rather than starting a second one over the top of it.
      if (pendingPick) { setHint('👆 Pick a card', true); haptic('light'); return; }
      if (freeBtn().disabled && adBtn().disabled) return;

      inFlight = true;
      freeBtn().disabled = true; adBtn().disabled = true;
      resetDeck('Shuffling…');

      // A saved ad is redeemed server-side from the ledger: no new ad, no token.
      if (isAd && (spinQuota?.ads_saved || 0) > 0) isAd = false;

      try {
        // The ad first, with the deck face-down. Nothing is animated until the
        // reward exists — the old wheel span on tap and asked for the reward
        // behind it, so a slow ad or a refused slot read as "it span and paid
        // nothing".
        let adToken = '';
        if (isAd) {
          setStatus('LOADING AD… ⏳');
          const r = await getAdToken();
          if (r.error) {
            setStatus(`<span style="color:var(--danger);">${esc(AD_ERROR_TEXT[r.error] || 'No ad available.')}</span>`);
            applyQuota(spinQuota);
            loadQuota();
            return;
          }
          adToken = r.token || '';
        }

        setStatus('DEALING… 🎴');
        const { ok, data } = await claimReward(adToken, (n) => {
          setStatus(`RECONNECTING… (${n}/2) 🎴`);
        });

        if (!ok || !data.ok || !data.reward) {
          resetDeck();
          const msg = esc((data && (data.message || data.error))
                          || 'Could not deal your cards.');
          // A banked ad is not a loss — it is the ad waiting for its slot, so
          // it gets the neutral colour rather than the error red.
          const banked = !!(data && data.ad_banked);
          setStatus(`<span style="color:${banked ? 'var(--gold)' : 'var(--danger)'};">${msg}</span>`);
          if (data && data.quota) {
            spinQuota = data.quota;
            applyQuota(spinQuota);
          } else if (data && data.error === 'cycle_exhausted') {
            freeBtn().disabled = true; adBtn().disabled = true;
          } else {
            applyQuota(spinQuota);
          }
          return;
        }

        // The reward is committed server-side from here on. The deck is only a
        // reveal, so the balance and the quota are updated now rather than
        // after the animation — a player who closes the app mid-reveal has
        // still been paid.
        setBalance(data.balance);
        spinQuota = data.quota || spinQuota;
        applyQuota(spinQuota);
        armDeck(data.reward);
      } catch (err) {
        resetDeck();
        const timedOut = err && err.name === 'AbortError';
        setStatus(`<span style="color:var(--danger);">${timedOut
          ? 'Timed out. Please try again — any watched ad is saved.'
          : 'Something went wrong. Try again.'}</span>`);
        applyQuota(spinQuota);
      } finally {
        inFlight = false;
        // armDeck leaves both buttons off on purpose: the round is live until
        // the reveal, and applyQuota above has already set what they say.
        if (pendingPick) { freeBtn().disabled = true; adBtn().disabled = true; }
      }
    }

    // Returns a zero-arg function that shows one ad and resolves when it was
    // watched, or null when the SDK isn't usable.
    async function adShowFn() {
      try {
        await window.__adSdkReady;
        const cfg = window.__adConfig;
        if (!cfg || !cfg.configured || !window.Adsgram?.init) return null;
        if (!window.__adController) {
          window.__adController = window.Adsgram.init({ blockId: cfg.block_id });
        }
        return () => window.__adController.show();
      } catch (e) {
        console.warn('[ads] no usable show function', e);
        return null;
      }
    }

    resetDeck();
    // Ask the server what this player can actually do before offering them an
    // ad for it.
    loadQuota();
  </script>
</body>
</html>
