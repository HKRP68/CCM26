<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lucky Spin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #4facfe;
      --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --hint: #a8a8b3;
      --success: #34c759;
      --danger: #ff3b30;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      margin: 0; padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .content { max-width: 480px; margin: 0 auto; padding: 24px; padding-bottom: 60px; }

    .header {
      display: flex; align-items: center; margin-bottom: 24px;
      background: rgba(0,0,0,0.2); padding: 16px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .avatar {
      width: 56px; height: 56px; background: var(--primary-gradient);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin-right: 16px; box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
      flex-shrink: 0; color: white; font-weight: 700;
    }
    .user-name { font-size: 20px; font-weight: 700; margin: 0; }
    .balance-row { display: flex; gap: 14px; margin-top: 4px; font-size: 14px; color: var(--hint); font-weight: 600; }

    /* ── Premium Spin Wheel (from the Crickidex / UnderCover design) ── */
    .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 30px auto; }
    .wheel {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(from -90deg,
        #1a1a2e 0deg 35.5deg, #111 35.5deg 36deg,
        #4facfe 36deg 71.5deg, #111 71.5deg 72deg,
        #1a1a2e 72deg 107.5deg, #111 107.5deg 108deg,
        #9c27b0 108deg 143.5deg, #111 143.5deg 144deg,
        #1a1a2e 144deg 179.5deg, #111 179.5deg 180deg,
        #ff3b30 180deg 215.5deg, #111 215.5deg 216deg,
        #1a1a2e 216deg 251.5deg, #111 251.5deg 252deg,
        #34c759 252deg 287.5deg, #111 287.5deg 288deg,
        #1a1a2e 288deg 323.5deg, #111 323.5deg 324deg,
        #ffd700 324deg 359.5deg, #111 359.5deg 360deg
      );
      border: 8px solid #222;
      box-shadow: 0 0 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.8);
      transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
    }
    .wheel-pointer {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
      border-top: 40px solid #ffd700; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
      z-index: 10; transform-origin: 50% 0%;
    }
    .wheel-pointer.tick { animation: pointer-click 0.15s ease-out; }
    .wheel-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 54px; height: 54px; background: radial-gradient(circle, #ffd700, #b78708, #111);
      border-radius: 50%; border: 4px solid #ffd700; box-shadow: 0 0 15px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 5;
    }
    .wheel-lights { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 3; }
    .light {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin-top: -4px; margin-left: -4px;
      border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff, 0 0 12px #ffd700;
      animation: light-flash 0.6s infinite alternate;
    }
    .light:nth-child(even) { animation-delay: 0.3s; background: #ffd700; }
    @keyframes light-flash {
      0% { opacity: 0.4; filter: brightness(0.8); }
      100% { opacity: 1; filter: brightness(1.3); box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
    }
    @keyframes pointer-click {
      0% { transform: translateX(-50%) rotate(0deg); }
      50% { transform: translateX(-50%) rotate(-15deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }
    .slice-text {
      position: absolute; top: 50%; left: 50%; width: 50%; height: 24px; margin-top: -12px;
      transform-origin: 0 50%; display: flex; align-items: center; justify-content: flex-end;
      padding-right: 25px; box-sizing: border-box; font-size: 18px; font-weight: 800;
      color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); user-select: none;
    }
    /* 10 slices, 36 degrees each. Center is i * 36 + 18 */
    .slice-text[data-i="0"] { transform: rotate(18deg); }
    .slice-text[data-i="1"] { transform: rotate(54deg); }
    .slice-text[data-i="2"] { transform: rotate(90deg); }
    .slice-text[data-i="3"] { transform: rotate(126deg); }
    .slice-text[data-i="4"] { transform: rotate(162deg); }
    .slice-text[data-i="5"] { transform: rotate(198deg); }
    .slice-text[data-i="6"] { transform: rotate(234deg); }
    .slice-text[data-i="7"] { transform: rotate(270deg); }
    .slice-text[data-i="8"] { transform: rotate(306deg); }
    .slice-text[data-i="9"] { transform: rotate(342deg); padding-right: 16px; font-size: 22px; }

    .grand-prize-tag {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 20px auto 25px auto; padding: 12px 20px; max-width: 300px; border-radius: 30px;
      background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.1), inset 0 0 10px rgba(255, 215, 0, 0.05);
      font-size: 14px; color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .prize-crown { font-size: 20px; animation: crown-float 2s ease-in-out infinite alternate; }
    @keyframes crown-float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-3px) scale(1.1); } }

    .btn {
      background: var(--primary-gradient); color: white; border: none; padding: 16px 24px;
      border-radius: 16px; font-weight: 700; font-size: 17px; width: 100%; cursor: pointer;
      box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3); transition: all 0.2s; font-family: inherit;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(79, 172, 254, 0.2); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; background: #555; box-shadow: none; }
    .btn.ghost { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); box-shadow: none; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .pulse { animation: pulse 2s infinite; }

    .title-block { text-align: center; margin-bottom: 18px; margin-top: 4px; }
    .title-block h1 { margin: 0 0 8px 0; font-size: 28px; }
    .title-block p { color: var(--hint); margin: 0; font-size: 15px; }
    .spin-status { text-align: center; font-size: 14px; margin-top: 18px; color: var(--hint); font-weight: 600; min-height: 22px; }
  </style>
</head>
<body>
  <div class="content">
    <div class="header">
      <div class="avatar" id="avatar">🏏</div>
      <div>
        <h1 class="user-name" id="user-name">Player</h1>
        <div class="balance-row">
          <span>💰 <b id="bal-coins">—</b></span>
          <span>💎 <b id="bal-gems">—</b></span>
        </div>
      </div>
    </div>

    <div class="title-block">
      <h1>Lucky Spin</h1>
      <p>Spin the wheel to win the Grand Prize!</p>
    </div>

    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <div class="wheel-lights">
        <div class="light" style="transform: rotate(0deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(36deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(72deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(108deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(144deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(180deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(216deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(252deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(288deg) translate(146px);"></div>
        <div class="light" style="transform: rotate(324deg) translate(146px);"></div>
      </div>
      <div class="wheel" id="spin-wheel">
        <div class="slice-text" data-i="0">100</div>
        <div class="slice-text" data-i="1">500</div>
        <div class="slice-text" data-i="2">💎</div>
        <div class="slice-text" data-i="3">1k</div>
        <div class="slice-text" data-i="4">100</div>
        <div class="slice-text" data-i="5">2k</div>
        <div class="slice-text" data-i="6">💎</div>
        <div class="slice-text" data-i="7">500</div>
        <div class="slice-text" data-i="8">100</div>
        <div class="slice-text" data-i="9">🏆</div>
      </div>
      <div class="wheel-center">⭐</div>
    </div>

    <div class="grand-prize-tag">
      <span class="prize-crown">👑</span>
      <span class="prize-tag-text">Grand Prize: <b>Rare Player Card</b></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
      <button class="btn pulse" id="free-spin-btn" onclick="executeSpin(false)"><span>🎁 Spin for Free</span></button>
      <button class="btn ghost" id="ad-spin-btn" onclick="executeSpin(true)"><span>📺 Watch Ad to Spin</span></button>
    </div>

    <div class="spin-status" id="spin-status"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const initData = (tg && tg.initData) ? tg.initData : '';
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'tma ' + initData };
    }

    // Greet the user from initData (cosmetic; balances fill in after a spin).
    (function greet() {
      try {
        const u = tg?.initDataUnsafe?.user;
        if (u) {
          document.getElementById('user-name').innerText = u.first_name || u.username || 'Player';
          if (u.first_name) document.getElementById('avatar').innerText = u.first_name[0].toUpperCase();
        }
      } catch (e) {}
    })();

    function setBalance(bal) {
      if (!bal) return;
      if (bal.coins != null) document.getElementById('bal-coins').innerText = Number(bal.coins).toLocaleString();
      if (bal.gems != null) document.getElementById('bal-gems').innerText = Number(bal.gems).toLocaleString();
    }

    let currentRotation = 0;

    function pickSlice(reward) {
      // Land on a slice that matches the reward type; otherwise a coin slice.
      if (reward && reward.type === 'player') return 9;       // jackpot slice
      if (reward && reward.type === 'gems') return [2, 6][Math.floor(Math.random() * 2)];
      const coinSlices = [0, 1, 3, 4, 5, 7, 8];
      return coinSlices[Math.floor(Math.random() * coinSlices.length)];
    }

    function animateTo(targetIndex) {
      try { tg?.HapticFeedback?.impactOccurred('rigid'); } catch (e) {}
      const offset = Math.floor(Math.random() * 24) - 12;     // -12..+12 deg
      const sliceCenter = targetIndex * 36 + 18;
      const targetDegree = 270 - (sliceCenter + offset);
      const extraSpins = 6;
      let nextRotation = currentRotation + (360 * extraSpins);
      nextRotation -= nextRotation % 360;
      currentRotation = nextRotation + targetDegree;

      const wheel = document.getElementById('spin-wheel');
      const pointer = document.querySelector('.wheel-pointer');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      // Pointer "tick" + haptic as each slice passes under the pointer.
      let lastSlice = -1;
      const startTime = Date.now();
      const duration = 5000;
      function checkTick() {
        if (Date.now() - startTime >= duration) { pointer?.classList.remove('tick'); return; }
        const style = window.getComputedStyle(wheel);
        const matrix = style.transform || style.webkitTransform;
        if (matrix && matrix !== 'none') {
          const v = matrix.split('(')[1].split(')')[0].split(',');
          let angle = Math.round(Math.atan2(parseFloat(v[1]), parseFloat(v[0])) * (180 / Math.PI));
          if (angle < 0) angle += 360;
          const cur = Math.floor(angle / 36);
          if (cur !== lastSlice) {
            lastSlice = cur;
            if (pointer) { pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick'); }
            try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {}
          }
        }
        requestAnimationFrame(checkTick);
      }
      requestAnimationFrame(checkTick);
    }

    function rewardText(r) {
      if (!r) return 'You won a prize!';
      if (r.type === 'player') {
        return `<span style="color:#FFD700;font-size:18px;font-weight:bold;text-shadow:0 0 15px #ffd700;">🎉 JACKPOT! Won ${r.player_name || 'a player'}${r.player_rating ? ` (${r.player_rating} OVR)` : ''}! 🎉</span>`;
      }
      if (r.type === 'gems') return `<span style="color:#a78bfa;">You won ${Number(r.amount).toLocaleString()} gems! 💎</span>`;
      return `<span style="color:#00f2fe;">You won ${Number(r.amount).toLocaleString()} coins!</span>`;
    }

    async function doSpin(adToken) {
      const res = await fetch('/api/webapp/spin', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify(adToken ? { ad_token: adToken } : {})
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    async function getAdToken() {
      // Best-effort: show an Adsgram ad if the SDK is available, then claim a token.
      try {
        if (window.Adsgram && window.__adController) { await window.__adController.show(); }
      } catch (e) { /* ad skipped/failed — still try to claim */ }
      const res = await fetch('/api/webapp/ad-completed', { method: 'POST', headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      return data && data.ad_token ? data.ad_token : '';
    }

    async function executeSpin(isAd) {
      const freeBtn = document.getElementById('free-spin-btn');
      const adBtn = document.getElementById('ad-spin-btn');
      const status = document.getElementById('spin-status');
      if (freeBtn.disabled && adBtn.disabled) return;

      freeBtn.disabled = true; adBtn.disabled = true;
      status.innerHTML = isAd ? 'LOADING AD… ⏳' : 'SPINNING… 🎡';

      try {
        let adToken = '';
        if (isAd) { adToken = await getAdToken(); status.innerHTML = 'SPINNING… 🎡'; }

        const { ok, status: code, data } = await doSpin(adToken);

        if (!ok || !data.ok) {
          const msg = (data && (data.message || data.error)) || 'Spin failed.';
          status.innerHTML = `<span style="color:var(--danger);">${msg}</span>`;
          // ad_required → free already used; keep ad button. cycle_exhausted → both off.
          if (data && data.error === 'cycle_exhausted') { freeBtn.disabled = true; adBtn.disabled = true; }
          else if (data && data.error === 'ad_required') { freeBtn.disabled = true; adBtn.disabled = false; }
          else { freeBtn.disabled = false; adBtn.disabled = false; }
          return;
        }

        const reward = data.reward;
        animateTo(pickSlice(reward));

        setTimeout(() => {
          status.innerHTML = rewardText(reward);
          setBalance(data.balance);
          try {
            if (reward && reward.type === 'player') tg?.HapticFeedback?.notificationOccurred('success');
            else tg?.HapticFeedback?.impactOccurred('heavy');
          } catch (e) {}
          // The free slot is consumed after a free spin; ad spins remain.
          if (data.slot_type === 'free') {
            freeBtn.innerHTML = '<span>⏳ Free spin used</span>';
            freeBtn.classList.remove('pulse'); freeBtn.disabled = true;
          } else {
            freeBtn.disabled = false;
          }
          adBtn.disabled = false;
        }, 5000);
      } catch (err) {
        status.innerHTML = '<span style="color:var(--danger);">Something went wrong. Try again.</span>';
        freeBtn.disabled = false; adBtn.disabled = false;
      }
    }

    // Optional Adsgram init (no-op without a configured block id).
    try {
      const blockId = (tg?.initDataUnsafe?.start_param || '').startsWith('block_')
        ? tg.initDataUnsafe.start_param.slice(6) : null;
      if (window.Adsgram && blockId) { window.__adController = window.Adsgram.init({ blockId }); }
    } catch (e) {}
  </script>
</body>
</html>
