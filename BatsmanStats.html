<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Player Stats Card</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">

<style>
:root {
  --logo-width: 430px;
  --logo-height: 420px;

  --red: #ff1f2d;
  --red-dark: #7c0008;
  --blue: #38a9ff;
  --white: #f4f4f6;
  --dark: #05080d;
  --panel: rgba(8, 13, 20, 0.88);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at top left, rgba(255,0,30,0.22), transparent 28%),
    radial-gradient(circle at top right, rgba(0,150,255,0.18), transparent 26%),
    linear-gradient(135deg, #020305, #070b12 50%, #020305);
  font-family: "Bricolage Grotesque", sans-serif;
  color: white;
}

.card {
  width: 1536px;
  height: 1024px;
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  padding: 46px 58px;
  background:
    linear-gradient(120deg, rgba(255,255,255,0.035), transparent 35%),
    radial-gradient(circle at 92% 24%, rgba(255,0,25,0.22), transparent 30%),
    linear-gradient(135deg, #05070b, #090f18 48%, #030407);
  border: 1px solid rgba(255,255,255,0.20);
  box-shadow:
    0 0 60px rgba(0,0,0,0.8),
    inset 0 0 38px rgba(255,255,255,0.055);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      120deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 12px
    );
  opacity: 0.45;
  pointer-events: none;
}

.card::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 310px;
  height: 310px;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,20,35,0.35) 0px,
      rgba(255,20,35,0.35) 2px,
      transparent 2px,
      transparent 13px
    );
  opacity: 0.55;
  pointer-events: none;
}

.top-area {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 480px;
  gap: 30px;
  height: 430px;
}

.player-name {
  display: flex;
  gap: 32px;
  align-items: center;
  margin-top: 26px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 118px;
  line-height: 1;
  letter-spacing: 4px;
  font-style: italic;
  text-shadow: 0 6px 0 rgba(0,0,0,0.65);
}

.first-name {
  color: var(--red);
  text-shadow:
    0 6px 0 rgba(0,0,0,0.65),
    0 0 18px rgba(255,0,30,0.36);
}

.last-name {
  color: var(--white);
}

.info-row {
  margin-top: 30px;
  display: flex;
  align-items: center;
  gap: 30px;
  font-size: 30px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1.5px;
}

.role-pill {
  padding: 10px 26px;
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(255,35,45,0.22), rgba(90,0,8,0.42));
  border: 1px solid var(--red);
  box-shadow:
    inset 0 0 18px rgba(255,40,50,0.16),
    0 0 16px rgba(255,35,45,0.22);
}

.divider {
  width: 1px;
  height: 42px;
  background: rgba(255,255,255,0.36);
}

.rating-row {
  margin-top: 58px;
  display: flex;
  align-items: center;
}

.rating-box {
  width: 470px;
  height: 165px;
  position: relative;
  padding: 22px 34px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%, 6% 50%);
  background:
    linear-gradient(135deg, rgba(255,0,25,0.26), rgba(0,0,0,0.58)),
    rgba(12,14,20,0.95);
  border: 1px solid rgba(255,50,60,0.85);
  box-shadow:
    inset 0 0 30px rgba(255,0,30,0.12),
    0 0 20px rgba(255,0,25,0.15);
}

.rating-box.overall {
  margin-left: -28px;
  background:
    linear-gradient(135deg, rgba(0,120,255,0.20), rgba(0,0,0,0.62)),
    rgba(12,14,20,0.95);
  border: 1px solid rgba(80,180,255,0.9);
  box-shadow:
    inset 0 0 30px rgba(0,140,255,0.12),
    0 0 20px rgba(0,140,255,0.15);
}

.rating-title {
  text-align: center;
  font-size: 24px;
  letter-spacing: 2px;
  font-weight: 900;
  font-style: italic;
}

.rating-number {
  margin-top: 8px;
  text-align: center;
  font-family: "Bebas Neue", sans-serif;
  font-size: 102px;
  line-height: 0.85;
  letter-spacing: 5px;
  color: #f4f4f6;
  text-shadow:
    0 6px 0 rgba(0,0,0,0.7),
    0 0 16px rgba(255,255,255,0.22);
}

.rating-box.batting .rating-number {
  color: #ff3340;
  text-shadow:
    0 6px 0 rgba(0,0,0,0.7),
    0 0 18px rgba(255,35,45,0.50);
}

.logo-side {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  position: relative;
}

.logo-side::before {
  content: "";
  position: absolute;
  inset: 20px 0 auto 0;
  height: 410px;
  background:
    radial-gradient(circle, rgba(255,30,40,0.20), transparent 65%);
  filter: blur(10px);
}

.logo-side img {
  width: var(--logo-width);
  height: var(--logo-height);
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter:
    drop-shadow(0 0 18px rgba(255,255,255,0.18))
    drop-shadow(0 0 22px rgba(255,0,30,0.20));
}

.stats-panel {
  position: relative;
  z-index: 3;
  margin-top: 8px;
  height: 454px;
  padding: 36px 56px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025)),
    var(--panel);
  border: 1px solid rgba(255,255,255,0.25);
  clip-path: polygon(2% 0, 98% 0, 100% 7%, 100% 91%, 98% 100%, 2% 100%, 0 91%, 0 7%);
  box-shadow:
    inset 0 0 28px rgba(255,255,255,0.055),
    0 18px 30px rgba(0,0,0,0.48);
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 70px;
  height: 100%;
}

.stats-col {
  display: grid;
  grid-template-rows: repeat(5, 1fr);
}

.stats-col.left {
  border-right: 1px solid rgba(255,255,255,0.35);
  padding-right: 70px;
}

.stat-row {
  display: grid;
  grid-template-columns: 70px 1fr 150px;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.stat-row:last-child {
  border-bottom: none;
}

.icon-box {
  width: 54px;
  height: 54px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 26px;
  font-weight: 900;
  background: rgba(255,0,25,0.07);
  box-shadow: inset 0 0 12px rgba(255,0,25,0.12);
}

.stat-label {
  font-size: 30px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
}

.stat-value {
  font-family: "Bebas Neue", sans-serif;
  text-align: right;
  font-size: 50px;
  letter-spacing: 3px;
  color: #f1f3f7;
  text-shadow: 0 4px 0 rgba(0,0,0,0.55);
}

.download-btn {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 50;
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: #19d071;
  color: #031109;
  font-weight: 900;
  cursor: pointer;
  font-family: "Bricolage Grotesque", sans-serif;
}
</style>
</head>

<body>

<button class="download-btn" onclick="downloadImage()">Download PNG</button>

<div class="card" id="playerCard">

  <div class="top-area">
    <div>
      <div class="player-name">
        <span class="first-name">VIRAT</span>
        <span class="last-name">KOHLI</span>
      </div>

      <div class="info-row">
        <div class="role-pill">BATTER</div>
        <div class="divider"></div>
        <div>RIGHT HAND</div>
        <div class="divider"></div>
        <div>RIGHT HAND</div>
        <div class="divider"></div>
        <div>MEDIUM</div>
      </div>

      <div class="rating-row">
        <div class="rating-box batting">
          <div class="rating-title">BATTING RATING</div>
          <div class="rating-number">95</div>
        </div>

        <div class="rating-box overall">
          <div class="rating-title">OVERALL RATING</div>
          <div class="rating-number">96</div>
        </div>
      </div>
    </div>

    <div class="logo-side">
      <img src="logo.png" alt="CricMaster Ultra Logo">
    </div>
  </div>

  <div class="stats-panel">
    <div class="stats-grid">

      <div class="stats-col left">
        <div class="stat-row">
          <div class="icon-box">🏏</div>
          <div class="stat-label">INNS</div>
          <div class="stat-value">5</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">HS</div>
          <div class="stat-label">HS</div>
          <div class="stat-value">11*</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">SR</div>
          <div class="stat-label">SR</div>
          <div class="stat-value">173.68</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">50</div>
          <div class="stat-label">50S</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">6</div>
          <div class="stat-label">6S</div>
          <div class="stat-value">2</div>
        </div>
      </div>

      <div class="stats-col">
        <div class="stat-row">
          <div class="icon-box">⚾</div>
          <div class="stat-label">RUNS</div>
          <div class="stat-value">33</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">📈</div>
          <div class="stat-label">AVG</div>
          <div class="stat-value">16.50</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">100</div>
          <div class="stat-label">100S</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">4</div>
          <div class="stat-label">4S</div>
          <div class="stat-value">3</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">🦆</div>
          <div class="stat-label">DUCKS</div>
          <div class="stat-value">0</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
function downloadImage() {
  const card = document.getElementById("playerCard");

  html2canvas(card, {
    backgroundColor: null,
    scale: 2
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "player-stats-card.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
</script>

</body>
</html>
