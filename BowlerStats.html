<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bowler Stats Card</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --logo-width: 430px;
  --logo-height: 420px;

  --red: #ff202d;
  --blue: #35aaff;
  --white: #f3f4f7;
  --dark: #05080d;
  --panel: rgba(7, 12, 18, 0.88);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at top left, rgba(255,0,30,0.24), transparent 28%),
    radial-gradient(circle at top right, rgba(0,155,255,0.18), transparent 28%),
    linear-gradient(135deg, #020305, #07101b 52%, #020305);
  font-family: "Bricolage Grotesque", sans-serif;
  color: #fff;
}

.card {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  border-radius: 30px;
  padding: 42px 52px;
  background:
    radial-gradient(circle at 82% 30%, rgba(255,30,40,0.20), transparent 28%),
    linear-gradient(120deg, rgba(255,255,255,0.035), transparent 35%),
    linear-gradient(135deg, #05070b, #090f18 48%, #030407);
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow:
    0 0 60px rgba(0,0,0,0.85),
    inset 0 0 38px rgba(255,255,255,0.055);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      120deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 12px
    );
  opacity: 0.45;
  pointer-events: none;
}

.card::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 330px;
  height: 330px;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,20,35,0.36) 0px,
      rgba(255,20,35,0.36) 2px,
      transparent 2px,
      transparent 13px
    );
  opacity: 0.55;
  pointer-events: none;
}

.top-area {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 470px;
  gap: 30px;
  height: 420px;
}

.player-name {
  display: flex;
  gap: 34px;
  align-items: center;
  margin-top: 22px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 118px;
  line-height: 1;
  letter-spacing: 4px;
  font-style: italic;
  text-shadow:
    0 7px 0 rgba(0,0,0,0.65),
    0 0 16px rgba(255,255,255,0.12);
}

.first-name {
  color: var(--red);
  text-shadow:
    0 7px 0 rgba(0,0,0,0.68),
    0 0 22px rgba(255,0,30,0.42);
}

.last-name {
  color: var(--white);
}

.info-row {
  margin-top: 34px;
  display: flex;
  align-items: center;
  gap: 30px;
  font-size: 29px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1.5px;
}

.role-pill {
  padding: 10px 26px;
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(255,35,45,0.26), rgba(90,0,8,0.45));
  border: 1px solid var(--red);
  box-shadow:
    inset 0 0 18px rgba(255,40,50,0.16),
    0 0 18px rgba(255,35,45,0.24);
}

.divider {
  width: 1px;
  height: 42px;
  background: rgba(255,255,255,0.36);
}

.rating-row {
  margin-top: 58px;
  display: flex;
  align-items: center;
}

.rating-box {
  width: 520px;
  height: 165px;
  position: relative;
  padding: 22px 34px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%, 6% 50%);
  background:
    linear-gradient(135deg, rgba(255,0,25,0.28), rgba(0,0,0,0.60)),
    rgba(12,14,20,0.95);
  border: 1px solid rgba(255,50,60,0.9);
  box-shadow:
    inset 0 0 34px rgba(255,0,30,0.13),
    0 0 22px rgba(255,0,25,0.17);
}

.rating-box.overall {
  margin-left: -30px;
  background:
    linear-gradient(135deg, rgba(0,130,255,0.22), rgba(0,0,0,0.64)),
    rgba(12,14,20,0.95);
  border: 1px solid rgba(80,180,255,0.95);
  box-shadow:
    inset 0 0 34px rgba(0,145,255,0.13),
    0 0 22px rgba(0,145,255,0.17);
}

.rating-title {
  text-align: center;
  font-size: 26px;
  letter-spacing: 2px;
  font-weight: 900;
  font-style: italic;
}

.rating-number {
  margin-top: 8px;
  text-align: center;
  font-family: "Bebas Neue", sans-serif;
  font-size: 106px;
  line-height: 0.85;
  letter-spacing: 5px;
  color: #f4f4f6;
  text-shadow:
    0 7px 0 rgba(0,0,0,0.72),
    0 0 18px rgba(255,255,255,0.22);
}

.rating-box.bowling .rating-number {
  color: #ff3340;
  text-shadow:
    0 7px 0 rgba(0,0,0,0.72),
    0 0 20px rgba(255,35,45,0.52);
}

.logo-side {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  position: relative;
}

.logo-side::before {
  content: "";
  position: absolute;
  inset: 10px 0 auto 0;
  height: 410px;
  background:
    radial-gradient(circle, rgba(255,30,40,0.22), transparent 66%);
  filter: blur(10px);
}

.logo-side img {
  width: var(--logo-width);
  height: var(--logo-height);
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter:
    drop-shadow(0 0 18px rgba(255,255,255,0.18))
    drop-shadow(0 0 24px rgba(255,0,30,0.24));
}

.stats-panel {
  position: relative;
  z-index: 3;
  margin-top: 6px;
  height: 392px;
  padding: 28px 58px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)),
    var(--panel);
  border: 1px solid rgba(255,255,255,0.25);
  clip-path: polygon(2% 0, 98% 0, 100% 8%, 100% 90%, 98% 100%, 2% 100%, 0 90%, 0 8%);
  box-shadow:
    inset 0 0 28px rgba(255,255,255,0.055),
    0 18px 30px rgba(0,0,0,0.48),
    0 0 18px rgba(255,40,45,0.12),
    0 0 18px rgba(0,150,255,0.12);
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 70px;
  height: 100%;
}

.stats-col {
  display: grid;
  grid-template-rows: repeat(5, 1fr);
}

.stats-col.left {
  border-right: 1px solid rgba(255,255,255,0.35);
  padding-right: 64px;
}

.stat-row {
  display: grid;
  grid-template-columns: 72px 1fr 150px;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.stat-row:last-child {
  border-bottom: none;
}

.icon-box {
  width: 58px;
  height: 58px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 26px;
  font-weight: 900;
  background: rgba(255,0,25,0.075);
  box-shadow: inset 0 0 13px rgba(255,0,25,0.13);
}

.stat-label {
  font-size: 30px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
}

.stat-value {
  font-family: "Bebas Neue", sans-serif;
  text-align: right;
  font-size: 50px;
  letter-spacing: 3px;
  color: #f1f3f7;
  text-shadow: 0 4px 0 rgba(0,0,0,0.58);
}

.download-btn {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 50;
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: #19d071;
  color: #031109;
  font-weight: 900;
  cursor: pointer;
  font-family: "Bricolage Grotesque", sans-serif;
}
</style>
</head>

<body>

<button class="download-btn" onclick="downloadImage()">Download PNG</button>

<div class="card" id="bowlerCard">

  <div class="top-area">
    <div>
      <div class="player-name">
        <span class="first-name">SHANE</span>
        <span class="last-name">WARNE</span>
      </div>

      <div class="info-row">
        <div class="role-pill">BOWLER</div>
        <div class="divider"></div>
        <div>RIGHT HAND</div>
        <div class="divider"></div>
        <div>RIGHT HAND</div>
        <div class="divider"></div>
        <div>LEG SPIN</div>
      </div>

      <div class="rating-row">
        <div class="rating-box bowling">
          <div class="rating-title">BOWLING RATING</div>
          <div class="rating-number">97</div>
        </div>

        <div class="rating-box overall">
          <div class="rating-title">OVERALL RATING</div>
          <div class="rating-number">97</div>
        </div>
      </div>
    </div>

    <div class="logo-side">
      <img src="logo.png" alt="CricMaster Ultra Logo">
    </div>
  </div>

  <div class="stats-panel">
    <div class="stats-grid">

      <div class="stats-col left">
        <div class="stat-row">
          <div class="icon-box">🏏</div>
          <div class="stat-label">INNS</div>
          <div class="stat-value">3</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">BBF</div>
          <div class="stat-label">BBF</div>
          <div class="stat-value">-</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">📈</div>
          <div class="stat-label">ECON</div>
          <div class="stat-value">11.33</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">🎩</div>
          <div class="stat-label">HATTRICKS</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">🏏</div>
          <div class="stat-label">3-FERS</div>
          <div class="stat-value">0</div>
        </div>
      </div>

      <div class="stats-col">
        <div class="stat-row">
          <div class="icon-box">|||</div>
          <div class="stat-label">WICKETS</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">📈</div>
          <div class="stat-label">AVG</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">⏱</div>
          <div class="stat-label">SR</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">🏏</div>
          <div class="stat-label">5-FERS</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat-row">
          <div class="icon-box">●</div>
          <div class="stat-label"></div>
          <div class="stat-value"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
function downloadImage() {
  const card = document.getElementById("bowlerCard");

  html2canvas(card, {
    backgroundColor: null,
    scale: 2
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "bowler-stats-card.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
</script>

</body>
</html>
