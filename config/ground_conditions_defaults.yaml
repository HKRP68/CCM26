# ─── PHASE BOOSTS ───
phase_boosts:
  powerplay:
    boundary_multiplier: 1.25
    overs_start: 0
    overs_end: 5
  death_overs:
    overs_start: 16
    overs_end: 19
    boundary_boost_batting_pitch: 2.2
    boundary_boost_bowling_pitch: 1.8
    wicket_boost: 1.35
    # Softer on the five surfaces where real matches lost 0.43-0.46 wickets an
    # over at the death, and a collapse there settled the game before the chase
    # could get going. Even, Hard and Dead keep the shared boost above.
    wicket_boost_by_pitch: {Dusty: 1.22, Green: 1.10, Dry: 1.22, Bouncy: 1.22, Flat: 1.22}
  second_innings_death:
    scoring_boost: 1.15
    wicket_boost: 1.1
  # Modern Death Surge (Unified T20 Engine v3.0, section 5C): on true surfaces
  # the last three overs have simply got faster than the rest of the death, and
  # a par 20th over in 2026 is not a par 20th over from 2020. Applies on top of
  # death_overs, on the listed pitches only — a dry or dusty track is the one
  # place the trend has not reached, because the surface stops it.
  # overs_start is 0-based, so 17 is the 18th over.
  death_surge:
    pitches: [Flat, Dead, Hard, Even]
    overs_start: 17
    rpo_boost: 1.0

# ─── GAME MODES ───
# Each mode applies multipliers on top of the pitch profile.
# Values are multipliers: 1.0 = no change. After applying, probabilities are re-normalized to 1.0.
game_modes:
  natural_game:
    label: "Natural Game"
    description: "Balanced, realistic T20 cricket simulation"
    icon: "fa-cricket-bat-ball"
    modifiers:
      dot_mult: 1.0
      single_mult: 1.0
      double_mult: 1.0
      three_mult: 1.0
      four_mult: 1.0
      six_mult: 1.0
      wicket_mult: 1.0
      extras_mult: 1.0

  aggressive:
