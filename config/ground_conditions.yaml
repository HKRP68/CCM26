# ─── PHASE BOOSTS ───
phase_boosts:
  powerplay:
    boundary_multiplier: 1.25
    overs_start: 0
    overs_end: 5
  death_overs:
    overs_start: 16
    overs_end: 19
    boundary_boost_batting_pitch: 2.2
    boundary_boost_bowling_pitch: 1.8
    wicket_boost: 1.35
  second_innings_death:
    scoring_boost: 1.15
    wicket_boost: 1.1
  # Modern Death Surge (Unified T20 Engine v3.0, section 5C): on true surfaces
  # the last three overs have simply got faster than the rest of the death, and
  # a par 20th over in 2026 is not a par 20th over from 2020. Applies on top of
  # death_overs, on the listed pitches only — a dry or dusty track is the one
  # place the trend has not reached, because the surface stops it.
  # overs_start is 0-based, so 17 is the 18th over.
  death_surge:
    pitches: [Flat, Dead, Hard, Even]
    overs_start: 17
    rpo_boost: 1.0

# ─── GAME MODES ───
# Each mode applies multipliers on top of the pitch profile.
# Values are multipliers: 1.0 = no change. After applying, probabilities are re-normalized to 1.0.
game_modes:
  natural_game:
    label: "Natural Game"
    description: "Balanced, realistic T20 cricket simulation"
    icon: "fa-cricket-bat-ball"
    modifiers:
      dot_mult: 1.0
      single_mult: 1.0
      double_mult: 1.0
      three_mult: 1.0
      four_mult: 1.0
      six_mult: 1.0
      wicket_mult: 1.0
      extras_mult: 1.0

  aggressive:
    label: "Aggressive"
    description: "Higher boundaries, higher wickets — high risk, high reward"
    icon: "fa-bolt"
    modifiers:
      dot_mult: 0.85
      single_mult: 0.81
      double_mult: 0.90
      three_mult: 0.90
      four_mult: 1.17
      six_mult: 1.26
      wicket_mult: 1.375
      extras_mult: 0.99

  defensive:
    label: "Defensive"
    description: "More dots and singles, fewer boundaries, moderate wickets"
    icon: "fa-shield-halved"
    modifiers:
      dot_mult: 1.20
      single_mult: 1.15
      double_mult: 1.05
      three_mult: 1.0
      four_mult: 0.75
      six_mult: 0.60
      wicket_mult: 0.90
      extras_mult: 1.0

  flat_track_bully:
    label: "Flat Track Bully"
    description: "Batting paradise — minimal wickets, boundary bonanza"
    icon: "fa-fire"
    modifiers:
      dot_mult: 0.80
      single_mult: 0.86
      double_mult: 0.99
      three_mult: 0.90
      four_mult: 1.22
      six_mult: 1.35
      wicket_mult: 0.69
      extras_mult: 0.81

  bowlers_day:
    label: "Bowler's Day"
    description: "High dot rates, high wickets, low boundaries"
    icon: "fa-bowling-ball"
    modifiers:
      dot_mult: 1.30
      single_mult: 1.05
      double_mult: 0.90
      three_mult: 0.90
      four_mult: 0.65
      six_mult: 0.50
      wicket_mult: 1.50
      extras_mult: 1.10

# ─── BLENDING WEIGHTS ───
blending:
  pitch_weight: 0.6
  skill_weight: 0.4

# ─── LIST A (50-OVER) SCORING MATRICES ───
# Used by ball_outcome.py when match_format == "ListA".
# Each section must sum to 1.0. Values mirror LISTA_*_MATRIX constants in
# engine/ball_outcome.py — edit both places if tuning.
scoring_matrices_lista:
  pp1:       # Overs 1-10 (0-9 index): new ball, attacking but measured
    Dot:    0.360
    Single: 0.370
    Double: 0.090
    Three:  0.005
    Four:   0.065
    Six:    0.020
    Wicket: 0.065
    Extras: 0.025
  middle:    # Overs 11-40 (10-39 index): consolidation, dot-ball pressure
    Dot:    0.420
    Single: 0.395
    Double: 0.070
    Three:  0.005
    Four:   0.040
    Six:    0.010
    Wicket: 0.045
    Extras: 0.015
  death:     # Overs 41-50 (40-49 index): slog — boom-or-bust
    Dot:    0.268
    Single: 0.295
    Double: 0.090
    Three:  0.008
    Four:   0.095
    Six:    0.058
    Wicket: 0.122
    Extras: 0.064

# ─── LIST A RUN FACTORS (per-pitch batting scaling) ───
# Applied to run-scoring outcomes before renormalisation.
# Wicket and Extras are kept unchanged by the scaling.
lista_run_factors:
  Green: 0.82   # Seam/swing — low-scoring
  Dry:   0.83   # Spin-heavy — marginally better than Green
  Hard:  1.00   # Neutral baseline (~265-275 first innings)
  Flat:  1.12   # Batting paradise
  Dead:  1.28   # Lifeless track — very high scores expected

# ─── LIST A PHASE BOOSTS ───
# Mild boundary/wicket nudges applied on top of the base matrix.
# fielders_outside = max permitted fielders outside 30-yard circle.
phase_boosts_lista:
  pp1:
    overs_start: 0
    overs_end: 9
    fielders_outside: 2
    boundary_multiplier_batting_pitch: 1.10   # Flat/Dead only
    boundary_multiplier_bowling_pitch: 1.00
  middle:
    overs_start: 10
    overs_end: 39
    fielders_outside: 4
    dot_multiplier: 1.05   # Soft dot-ball pressure in consolidation phase
  death:
    overs_start: 40
    overs_end: 49
    fielders_outside: 5
    wicket_boost: 1.05     # Slog-or-perish wicket nudge
    boundary_boost_batting_pitch: 1.08   # Flat/Dead get a small extra push
  second_innings_death:
    scoring_boost: 1.08    # Chaser's knowledge advantage in slog overs
    wicket_boost: 1.05
