# SimCricketX Ground Conditions Configuration
# Edit via Ground Conditions UI or directly in this file
#
# Reading a pitch profile — the four knobs, and what each one actually does:
#
#   scoring_matrix   The surface's own ball-by-ball shape before any player,
#                    phase or approach layer. Must sum to 1.0. Read it as three
#                    separate statements: Dot says how hard it is to get off
#                    strike, Four+Six how freely the boundary comes, and Wicket
#                    how much the surface gives the bowlers in aggregate.
#
#   wicket_factors   WHO gets those wickets, by bowling type. This is the
#                    surface's identity: a green top pays the fast-medium
#                    swing bowler first, a raging turner pays every spinner,
#                    a road pays nobody. Every profile lists all seven types
#                    the engine knows (Fast / Fast-medium / Medium-fast /
#                    Off spin / Finger spin / Leg spin / Wrist spin) so no
#                    bowler silently lands on `default`.
#
#   run_factor       A batting-friendliness index, ordered with the par bands
#                    (0.86 on the rankest turner, 1.22 on a shirtfront).
#                    NOTE what it does mechanically: ball_outcome multiplies
#                    every NON-wicket bucket by it and then normalises, so in
#                    the T20 pipeline it is a survival dial — it changes how
#                    often a wicket falls, not the runs per scoring shot. The
#                    per-ball run value lives in scoring_matrix. The super-over
#                    engine blends it against player skill, which is why it is
#                    kept near 1.0 and monotone rather than used as a free
#                    scaling knob.
#
#   scoring_dynamics / chase_win_pct
#                    The Pitch Rule Engine spec targets: the first-innings
#                    Floor/Par/Ceiling/Anomaly distribution, and the chance the
#                    chasing side overhauls a given total. Each chase grid is
#                    centred on THAT pitch's own par, so the 50% crossing sits
#                    at par on every surface and the win% at par is the
#                    surface's innings-2 character — hardest on a turner whose
#                    footmarks deepen, easiest on a green top whose grass burns
#                    off. tools/pitch_calibration.py measures both.

