<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#021025}
  body{display:grid;place-items:center;min-height:100vh;overflow-x:hidden;font-family:Arial,Helvetica,sans-serif}
  .graphic{display:block;width:min(100vw,150vh);height:auto;max-width:1536px;box-shadow:0 0 80px rgba(0,132,254,.20);background:#041129}
  svg text{font-family:Arial,Helvetica,sans-serif;paint-order:stroke;letter-spacing:-.4px}
  .title{font-size:80px;font-weight:1000;fill:#f6f8ff;font-style:italic;letter-spacing:1.5px;filter:url(#titleShadow)}
  .subtitle{font-size:31px;font-weight:900;font-style:italic;fill:#001a3a;letter-spacing:.2px}
  .venue{font-size:21px;font-weight:900;font-style:italic;fill:#f6fbff}
  .pitch{font-size:22px;font-weight:900;font-style:italic;fill:#f8fcff}
  .teamname{font-size:43px;font-weight:1000;font-style:italic;fill:#fff;letter-spacing:-1.2px}
  .over{font-size:37px;font-weight:1000;font-style:italic;fill:#231022}
  .score{font-size:86px;font-weight:1000;font-style:italic;letter-spacing:-3px}
  .player{font-size:30px;font-weight:900;fill:#f5f7fa}
  .player.bright{font-size:27px}
  .runs{font-size:34px;font-weight:1000;fill:#ffe17b}
  .balls{font-size:29px;font-weight:500;fill:#f9f9fc}
  .runs[data-bind^="teamB"]{fill:#67e9ba}
  .impact-tag{font-size:16px;font-weight:1000;font-style:italic;fill:#f0ffcf;letter-spacing:0}
  .winner{font-size:48px;font-weight:1000;font-style:italic;fill:#fff1a1;letter-spacing:-.3px}
  .potm-key{font-size:40px;font-style:italic;font-weight:1000;fill:#0d0b15}
  .potm-name{font-size:37px;font-style:italic;font-weight:1000;fill:#fff}
  .potm-stat{font-size:33px;font-weight:1000;fill:#ffe17f}
  .potm-muted{font-size:30px;font-weight:500;fill:#fff}
  @media print{body{background:white}.graphic{width:100%;max-width:none;box-shadow:none} @page{size:landscape;margin:0}}
</style>

  // To reuse this design for the next match, edit ONLY the JSON above.
  // The left-hand rows are batting; right-hand rows are opposition bowling.
  const match = JSON.parse(document.getElementById('match-data').textContent);
  const lookup = (path) => path === 'header' ? `${match.season} • ${match.number}` : path.split('.').reduce((o,k) => o?.[k], match);
  document.querySelectorAll('[data-bind]').forEach(el => {
    const value = lookup(el.dataset.bind);
    if (value !== undefined && value !== null) el.textContent = value;
  });
  // Highlight the named Impact Player in their existing batting row.
  const impactName = String(match.impact || '').trim().toUpperCase();
  const highlightedIndex = match.teamB.batting.findIndex(row => String(row[0]).trim().toUpperCase() === impactName);
  const impactBar = document.querySelector('#impact-highlight');
  const impactTag = document.querySelector('.impact-tag');
  if (impactBar) impactBar.setAttribute('transform', `translate(0,${Math.max(0, highlightedIndex) * 43.5})`);
  if (impactBar) impactBar.style.display = highlightedIndex === -1 ? 'none' : '';
  document.querySelectorAll('[data-bind^="teamB.batting."][data-bind$=".0"]').forEach((el,i)=> el.classList.toggle('bright',i===highlightedIndex));
  if (impactTag) impactTag.textContent = 'IMPACT PLAYER';
