{% extends "base.html" %}
{% block title %}{{ season.name }} — Franchise Draft{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static',filename='css/auction_miniapp.css',v='draft-controls-v4') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/franchise_draft.css',v='draft-controls-v4') }}">
{% endblock %}
{% block content %}
<div class="au-shell"><a href="{{ url_for('admin_franchise_drafts_list') }}">← Franchise Drafts</a><div id="admin-draft-workspace"></div></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static',filename='js/franchise_draft.js',v='draft-controls-v4') }}"></script>
<script>FranchiseDraftApp.open('admin-draft-workspace',{{ season.id }},{endpoint:'/api/admin/franchise-draft',csrf:{{ csrf_token()|tojson }}});</script>
{% endblock %}
